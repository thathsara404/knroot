name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend — lint + type-check
  # ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Backend Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 mypy types-redis types-bcrypt

      - name: flake8 — style + complexity
        run: |
          flake8 backend/ wsgi.py \
            --max-line-length=100 \
            --max-complexity=12 \
            --ignore=E501,W503 \
            --exclude=backend/migrations

      - name: mypy — static type checking
        run: |
          mypy backend/ wsgi.py \
            --ignore-missing-imports \
            --exclude 'backend/migrations' \
            --strict-optional \
            --warn-return-any

  # ─────────────────────────────────────────────────────────────
  # 2. Backend — unit tests
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/1
      SESSION_SECRET_KEY: ci-test-secret-not-for-production
      OPENROUTER_API_KEY: test-key-mocked-in-tests
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-flask pytest-cov pytest-mock fakeredis

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --cov-omit="backend/migrations/*" \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  # ─────────────────────────────────────────────────────────────
  # 3. E2E — Playwright against full Docker Compose stack
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend]
    # Only run E2E if the e2e directory exists and has spec files
    if: ${{ hashFiles('e2e/**/*.spec.ts') != '' }}

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SESSION_SECRET_KEY: ${{ secrets.CI_SESSION_SECRET }}
      OPENROUTER_MODEL: deepseek/deepseek-chat

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright + dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start full stack via Docker Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
        env:
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          SESSION_SECRET_KEY: ${{ env.SESSION_SECRET_KEY }}

      - name: Wait for stack to be healthy
        run: |
          echo "Waiting for web service..."
          timeout 120 bash -c \
            'until curl -sf http://localhost:5000/health | grep -q "ok"; do sleep 3; done'
          echo "Stack is ready."

      - name: Run Playwright E2E specs
        run: npx playwright test --reporter=html
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────
  # 4. All-green gate — branch protection requirement
  # ─────────────────────────────────────────────────────────────
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          results=(
            "${{ needs.lint-backend.result }}"
            "${{ needs.test-backend.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "One or more required jobs did not succeed: $r"
              exit 1
            fi
          done
          echo "All required checks passed."
