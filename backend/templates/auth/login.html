{% extends "base.html" %}

{% block title %}Sign In — Knowledge Root{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center px-4 py-12 bg-gradient-to-br from-slate-50 via-white to-indigo-50">
  <div class="w-full max-w-sm space-y-6">

    <div class="text-center">
      <h1 class="text-3xl font-bold tracking-tight">Knowledge Root</h1>
      <p class="mt-1 text-sm text-gray-500">Sign in to continue learning</p>
    </div>

    <div id="login-error"
         class="hidden rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700"
         role="alert"></div>

    <form
      hx-post="/auth/login"
      hx-on::after-request="handleAuthResponse(event, 'login-error')"
      class="space-y-4 rounded-2xl bg-white p-8 shadow-lg border border-gray-100/80 ring-1 ring-black/5"
      x-data="{ loading: false, showPassword: false }"
      @htmx:before-request.window="loading = true"
      @htmx:after-request.window="loading = false"
    >
      <div>
        <label for="identifier" class="block text-sm font-medium text-gray-700">
          Username or Email
        </label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          autocomplete="username"
          required
          class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                 shadow-sm placeholder-gray-400 focus:border-indigo-500 focus:ring-1
                 focus:ring-indigo-500 focus:outline-none"
          placeholder="you@example.com"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative mt-1">
          <input
            id="password"
            name="password"
            :type="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            required
            class="block w-full rounded-lg border border-gray-300 px-3 py-2 pr-10 text-sm
                   shadow-sm placeholder-gray-400 focus:border-indigo-500 focus:ring-1
                   focus:ring-indigo-500 focus:outline-none"
            placeholder="••••••••"
          >
          <button type="button" @click="showPassword = !showPassword"
                  :aria-label="showPassword ? 'Hide password' : 'Show password'"
                  class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
            <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="showPassword" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <button
        type="submit"
        :disabled="loading"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white
               shadow-sm hover:bg-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed
               focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        <span x-show="!loading">Sign In</span>
        <span x-show="loading" x-cloak>Signing in…</span>
      </button>
    </form>

    <p class="text-center text-sm text-gray-500">
      Don't have an account?
      <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">Create one</a>
    </p>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
