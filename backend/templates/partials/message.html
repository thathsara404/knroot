{# partials/message.html — single message, appended to #chat-messages via HTMX #}
{# Variables: role (str), content (str) #}
{% if role == 'user' %}
<div class="flex justify-end mb-3">
  <div class="max-w-lg bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm whitespace-pre-wrap">
    {{ content }}
  </div>
</div>
{% else %}
<div class="flex justify-start mb-3">
  <div class="max-w-2xl w-full bg-white/80 border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm">
    <p class="text-sm text-gray-800 whitespace-pre-wrap">{{ content }}</p>
  </div>
</div>
{% endif %}
